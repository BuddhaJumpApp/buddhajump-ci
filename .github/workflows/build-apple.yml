name: build-apple

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: 'App name'
      pkg:
        required: true
        type: string
        description: 'Package name'
      version:
        required: true
        type: string
        description: 'Version to build'
      publish_to_stores:
        required: false
        default: false
        type: boolean
        description: 'Publish to the App Store Connect account'
      publish_ios_testflight:
        required: false
        default: false
        type: boolean
        description: 'Upload ONLY the iOS build to TestFlight.'
      publish_macos_testflight:
        required: false
        default: false
        type: boolean
        description: 'Upload ONLY the macOS build to TestFlight. Requires APPLE_INSTALLER_PKCS12_BASE64/_PASSWORD (Mac Installer Distribution identity) — productbuild cannot sign the .pkg without it.'
      # [2026-09-09 v1.7.5] Packaging of the tunnel inside the Developer ID DMG.
      # 'sysex' = Network System Extension (the only packet-tunnel form macOS
      # accepts outside the App Store); 'skip' = build no DMG this run.
      dmg_tunnel:
        required: false
        default: 'sysex'
        type: string
        description: "Developer ID DMG tunnel packaging: 'sysex' (default) or 'skip' (no DMG this run)"

jobs:
  build-apple-app:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ORG_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set build environment
        run: |
          set -xeuo pipefail
          echo "BUILD_VERSION=${{ inputs.version }}" >> "${GITHUB_ENV}"
          # Derive the build number exactly the way build-android.yml derives
          # versionCode, so one release carries ONE number on all four
          # platforms. Both Info.plists read $(FLUTTER_BUILD_NUMBER), which
          # Flutter reads from pubspec, so rewriting pubspec is enough -- no
          # need to thread --build-number through the ipa and macos commands.
          # Without this the Apple side used whatever counter pubspec happened
          # to carry, and 1.2.8 shipped as 128 on Android but 30 on iOS.
          # NOTE: this job is macos-latest, so that is BSD sed -- `-i ''`.
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%+*}"
          IFS='.' read -r a b c <<< "$VERSION"
          BUILD_NUMBER=$((a * 100 + b * 10 + c))
          sed -i '' "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Apple build number: ${BUILD_NUMBER}"
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Check Flutter version
        run: |
          flutter --version

      - name: Setup keychain and certificates
        run: |
          APPLE_PKCS12_PATH=$RUNNER_TEMP/Certificates.p12
          APPLE_KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $APPLE_KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $APPLE_KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $APPLE_KEYCHAIN_PATH
          echo -n "${{ secrets.APPLE_PKCS12_BASE64 }}" | base64 -d -o $APPLE_PKCS12_PATH
          security import $APPLE_PKCS12_PATH -P "${{ secrets.APPLE_PKCS12_PASSWORD }}" -A -t cert -f pkcs12 -k $APPLE_KEYCHAIN_PATH
          # Mac Installer Distribution identity — a SEPARATE certificate from the
          # app-signing one above. productbuild needs it to sign the .pkg that
          # macOS TestFlight/App Store submissions require. Kept as its own
          # secret so it can be renewed independently (it expires 2027-07-29)
          # without rotating the app-signing credential that already works.
          # Optional: skipped when unset, so builds that don't sign a pkg still run.
          if [ -n "${{ secrets.APPLE_INSTALLER_PKCS12_BASE64 }}" ]; then
            APPLE_INSTALLER_PKCS12_PATH=$RUNNER_TEMP/InstallerCertificate.p12
            echo -n "${{ secrets.APPLE_INSTALLER_PKCS12_BASE64 }}" | base64 -d -o $APPLE_INSTALLER_PKCS12_PATH
            security import $APPLE_INSTALLER_PKCS12_PATH -P "${{ secrets.APPLE_INSTALLER_PKCS12_PASSWORD }}" -A -t cert -f pkcs12 -k $APPLE_KEYCHAIN_PATH
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $APPLE_KEYCHAIN_PATH
          security list-keychain -d user -s $APPLE_KEYCHAIN_PATH

      - name: Install provisioning profiles
        run: |
          APPLE_PROVISIONING_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$APPLE_PROVISIONING_PATH"
          echo -n "${{ secrets.APPLE_PROVISIONING_BASE64 }}" | base64 -d | tar -xJf - -C "$APPLE_PROVISIONING_PATH"

      - name: Build ${{ matrix.platform }} app
        run: |
          set -xeuo pipefail
          echo "Building ${{ inputs.name }} ${{ inputs.version }} (Release Mode)"
          rm -rf .dart_tool build/${{ matrix.platform }} ${{ matrix.platform }}/.Pods
          flutter gen-l10n
          flutter pub run flutter_launcher_icons

          if [ "${{ matrix.platform }}" == "ios" ]; then
            flutter build ipa --release \
                --obfuscate \
                --split-debug-info=debug-info/ios \
                --suppress-analytics \
                --no-tree-shake-icons \
                --export-options-plist=ios/ExportOptions.plist
            mv build/ios/ipa/*.ipa "build/ios/ipa/${{ inputs.name }}-${{ inputs.version }}.ipa"
            echo "UPLOAD_FILE=build/ios/ipa/${{ inputs.name }}-${{ inputs.version }}.ipa" >> "$GITHUB_ENV"
          else
            flutter build macos --release \
                --obfuscate \
                --split-debug-info=debug-info/macos \
                --suppress-analytics \
                --no-tree-shake-icons
            APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app)
            if [ "${{ inputs.publish_to_stores }}" == "true" ] || [ "${{ inputs.publish_macos_testflight }}" == "true" ]; then
              PKG_PATH="build/macos/${{ inputs.name }}-${{ inputs.version }}.pkg"
              INSTALLER_CERT=$(security find-identity -v -p basic | grep "3rd Party Mac Developer Installer" | head -1 | awk -F'"' '{print $2}' || true)
              test -n "$INSTALLER_CERT"
              productbuild --component "$APP_PATH" /Applications --sign "$INSTALLER_CERT" "$PKG_PATH"
              echo "UPLOAD_FILE=$PKG_PATH" >> "$GITHUB_ENV"
            else
              ZIP_PATH="build/macos/${{ inputs.name }}-macos-${{ inputs.version }}.zip"
              ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
              echo "UPLOAD_FILE=$ZIP_PATH" >> "$GITHUB_ENV"
            fi
          fi

      # ── Notarized DMG for distribution OUTSIDE the App Store ────────────────
      # The .pkg this workflow already builds is signed "3rd Party Mac Developer
      # Installer" -- that is a Mac App Store SUBMISSION format. A user who
      # downloads it cannot install it, and the .app inside is signed "Apple
      # Distribution", which Gatekeeper rejects outside the Store. Direct
      # distribution needs a different certificate entirely (Developer ID
      # Application), Hardened Runtime, and notarization.
      #
      # So the app is re-signed here rather than rebuilt: same bits, different
      # identity. Signing runs inside-out (nested code first) because codesign
      # seals what it contains -- signing the bundle first and its frameworks
      # after invalidates the outer signature.
      #
      # Must sit BEFORE "Clean up keychain": that step deletes the keychain and
      # the provisioning profiles this needs.
      #
      # Skipped silently when the Developer ID secrets are unset, so a repo
      # without them still builds everything else.
      # [2026-09-09 v1.7.5] The tunnel inside the DMG is now a Network SYSTEM
      # Extension (Contents/Library/SystemExtensions/<id>.systemextension), not
      # the ServiceExtension.appex the App Store build embeds: neagent refuses an
      # app-extension NE provider signed with Developer ID ("Rejecting app
      # extension provider ... Developer ID certificate") and TN3134 marks the
      # packet-tunnel appex as App Store only. The .pkg path above is untouched:
      # same Runner.app, same appex, same App Store profiles. The sysex is built
      # here with xcodebuild from the SystemTunnel target AFTER `flutter build
      # macos` (the project-level xcconfig includes the Flutter-generated one,
      # which only exists after that build), then dropped into a COPY of the app,
      # which is re-signed inside-out with the Developer ID identity and the
      # DevID entitlements (macos/Runner/DeveloperID.entitlements +
      # macos/SystemTunnel/SystemTunnel.entitlements). Every structural check
      # fails LOUDLY rather than publish a DMG that installs but cannot connect;
      # continue-on-error + the trailing "Fail the job" step keep the store
      # uploads running while still turning the run red. `dmg_tunnel: skip`
      # builds no DMG at all.
      - name: Build notarized DMG (macOS direct distribution)
        if: matrix.platform == 'macos'
        id: dmg
        continue-on-error: true
        env:
          DMG_TUNNEL: ${{ inputs.dmg_tunnel }}
          TEAM_ID: YL6HJ6PT47
          APP_GROUP: group.com.fjolsky.buddhajump
        run: |
          set -euo pipefail
          # Guarded here rather than in `if:` -- a step-level `env:` is not yet
          # in scope when its own `if:` is evaluated, and the secrets context is
          # not available there at all.
          if [ -z "${{ secrets.APPLE_DEVELOPER_ID_PKCS12_BASE64 }}" ]; then
            echo "No Developer ID secrets configured; skipping the DMG."
            exit 0
          fi
          # [2026-09-09 v1.7.5] operator escape hatch: no DMG this run.
          case "${DMG_TUNNEL:-sysex}" in
            sysex) ;;
            skip)  echo "dmg_tunnel=skip: not building the Developer ID DMG this run."; exit 0 ;;
            *)     echo "::error::dmg_tunnel must be 'sysex' or 'skip', got '${DMG_TUNNEL}'"; exit 1 ;;
          esac
          set -x
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db

          # Developer ID identity, imported into the SAME keychain the build used.
          DEVID_P12=$RUNNER_TEMP/DeveloperID.p12
          echo -n "${{ secrets.APPLE_DEVELOPER_ID_PKCS12_BASE64 }}" | base64 -d -o $DEVID_P12
          security import $DEVID_P12 -P "${{ secrets.APPLE_DEVELOPER_ID_PKCS12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "" $KEYCHAIN 2>/dev/null || true
          DEVID_CERT=$(security find-identity -v -p codesigning $KEYCHAIN | grep "Developer ID Application" | head -1 | awk -F\" '{print $2}')
          test -n "$DEVID_CERT"

          # Developer ID provisioning profiles. The NetworkExtension entitlement
          # is restricted, so each bundle needs a profile that grants it -- the
          # App Store profiles installed earlier do not cover direct distribution.
          PROF_DIR=$RUNNER_TEMP/devid-profiles
          mkdir -p "$PROF_DIR"
          echo -n "${{ secrets.APPLE_DEVID_PROVISIONING_BASE64 }}" | base64 -d | tar -xJf - -C "$PROF_DIR"

          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app)
          APP_NAME=$(basename "$APP_PATH" .app)

          # Work on a copy: the original .app may already have been turned into
          # the TestFlight .pkg, and re-signing it would invalidate that.
          WORK=$RUNNER_TEMP/dmgwork
          rm -rf "$WORK"; mkdir -p "$WORK"
          ditto "$APP_PATH" "$WORK/$APP_NAME.app"
          SIGN_APP="$WORK/$APP_NAME.app"

          # [2026-09-09 v1.7.5 sysex] was (appex path, retired -- neagent rejects it under Developer ID):
          #   APPEX=$(find "$SIGN_APP" -name '*.appex' -maxdepth 4 | head -1 || true)
          #   cp "$PROF_DIR/BuddhaJump_DevID_macOS.provisionprofile" "$SIGN_APP/Contents/embedded.provisionprofile"
          #   if [ -n "$APPEX" ]; then
          #     cp "$PROF_DIR/BuddhaJump_Service_DevID_macOS.provisionprofile" "$APPEX/Contents/embedded.provisionprofile"
          #   fi

          # ── [2026-09-09 v1.7.5] 1. Build the SystemTunnel target (unsigned here; signed
          # below with the same inside-out codesign the rest of the bundle gets). A
          # separate derived-data dir keeps build/macos/Build/Products/Release, where the
          # .pkg and this copy come from, byte-identical to today. ──
          PB=/usr/libexec/PlistBuddy
          APP_ID=$($PB -c 'Print :CFBundleIdentifier' "$SIGN_APP/Contents/Info.plist")
          APP_VER=$($PB -c 'Print :CFBundleShortVersionString' "$SIGN_APP/Contents/Info.plist")
          APP_BUILD=$($PB -c 'Print :CFBundleVersion' "$SIGN_APP/Contents/Info.plist")
          SYSEX_DD=$RUNNER_TEMP/sysex-derived
          rm -rf "$SYSEX_DD"
          xcodebuild -list -project macos/Runner.xcodeproj | grep -q 'SystemTunnel' \
            || { echo "::error::macos/Runner.xcodeproj has no SystemTunnel target (app repo too old for the sysex DMG)"; exit 1; }
          xcodebuild -project macos/Runner.xcodeproj -target SystemTunnel -configuration Release \
            -derivedDataPath "$SYSEX_DD" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO build
          SYSEX_BUILT=$(find "$SYSEX_DD/Build/Products/Release" -maxdepth 1 -name '*.systemextension' -type d | head -1 || true)
          if [ -z "$SYSEX_BUILT" ]; then
            echo "::error::SystemTunnel target produced no .systemextension under $SYSEX_DD/Build/Products/Release"
            exit 1
          fi
          SYSEX_ID=$($PB -c 'Print :CFBundleIdentifier' "$SYSEX_BUILT/Contents/Info.plist")
          SYSEX_PKG=$($PB -c 'Print :CFBundlePackageType' "$SYSEX_BUILT/Contents/Info.plist")
          SYSEX_CLASS=$($PB -c 'Print :NetworkExtension:NEProviderClasses:com.apple.networkextension.packet-tunnel' "$SYSEX_BUILT/Contents/Info.plist" 2>/dev/null || true)
          case "$SYSEX_ID" in "$APP_ID".*) ;; *) echo "::error::sysex bundle id '$SYSEX_ID' is not a child of '$APP_ID'"; exit 1 ;; esac
          [ "$SYSEX_PKG" = "SYSX" ] || { echo "::error::sysex CFBundlePackageType is '$SYSEX_PKG', expected SYSX"; exit 1; }
          [ -n "$SYSEX_CLASS" ] || { echo "::error::sysex Info.plist lacks NetworkExtension/NEProviderClasses/com.apple.networkextension.packet-tunnel"; exit 1; }
          if $PB -c 'Print :NSExtension' "$SYSEX_BUILT/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::sysex Info.plist still carries an NSExtension dict (activation fails with validationFailed)"; exit 1
          fi
          [ "$(basename "$SYSEX_BUILT")" = "$SYSEX_ID.systemextension" ] || { echo "::error::sysex product is '$(basename "$SYSEX_BUILT")'; must be '<bundle id>.systemextension'"; exit 1; }
          test -f "$SYSEX_BUILT/Contents/Frameworks/librainbox.dylib" || { echo "::error::sysex has no Contents/Frameworks/librainbox.dylib -- engine not embedded"; exit 1; }
          SYSEX_VER=$($PB -c 'Print :CFBundleShortVersionString' "$SYSEX_BUILT/Contents/Info.plist")
          SYSEX_BUILD=$($PB -c 'Print :CFBundleVersion' "$SYSEX_BUILT/Contents/Info.plist")
          if [ "$SYSEX_VER/$SYSEX_BUILD" != "$APP_VER/$APP_BUILD" ]; then
            echo "::error::sysex version $SYSEX_VER ($SYSEX_BUILD) != app $APP_VER ($APP_BUILD) -- OSSystemExtensionManager keys upgrades on these"; exit 1
          fi
          SYSEX_EXE="$SYSEX_BUILT/Contents/MacOS/$($PB -c 'Print :CFBundleExecutable' "$SYSEX_BUILT/Contents/Info.plist")"
          APP_EXE="$SIGN_APP/Contents/MacOS/$($PB -c 'Print :CFBundleExecutable' "$SIGN_APP/Contents/Info.plist")"
          [ "$(lipo -archs "$SYSEX_EXE" | tr ' ' '\n' | sort | tr '\n' ' ')" = "$(lipo -archs "$APP_EXE" | tr ' ' '\n' | sort | tr '\n' ' ')" ] \
            || { echo "::error::arch mismatch: sysex [$(lipo -archs "$SYSEX_EXE")] vs app [$(lipo -archs "$APP_EXE")]"; exit 1; }

          # ── 2. Assemble: drop the appex, add the sysex ──
          # The appex is removed, not kept: it can never run under Developer ID,
          # it would duplicate the engine in the DMG, and FlutterBridge decides
          # "sysex mode" purely from the presence of the SystemExtensions dir.
          rm -rf "$SIGN_APP/Contents/PlugIns/ServiceExtension.appex"
          rmdir "$SIGN_APP/Contents/PlugIns" 2>/dev/null || true
          test ! -e "$SIGN_APP/Contents/PlugIns/ServiceExtension.appex"
          mkdir -p "$SIGN_APP/Contents/Library/SystemExtensions"
          SYSEX="$SIGN_APP/Contents/Library/SystemExtensions/$(basename "$SYSEX_BUILT")"
          rm -rf "$SYSEX"
          ditto "$SYSEX_BUILT" "$SYSEX"

          # ── 3. Provisioning profiles, chosen by CONTENT, not by file name ──
          # A profile is only usable if its application-identifier matches the
          # bundle it is embedded in AND it grants what the entitlements claim.
          # A stale APPLE_DEVID_PROVISIONING_BASE64 (no system-extension.install,
          # no sysex id) therefore fails here, not at the user's first click.
          prof_ent() { security cms -D -i "$1" 2>/dev/null > "$RUNNER_TEMP/prof.plist" && $PB -c "Print :Entitlements:$2" "$RUNNER_TEMP/prof.plist" 2>/dev/null; }
          pick_profile() {   # $1 = application-identifier wanted; $2.. = entitlement keys that must be present
            local want="$1"; shift
            local p k ok
            for p in "$PROF_DIR"/*.provisionprofile; do
              [ "$(prof_ent "$p" com.apple.application-identifier)" = "$want" ] || continue
              ok=1
              for k in "$@"; do prof_ent "$p" "$k" >/dev/null || ok=0; done
              [ "$ok" = 1 ] && { echo "$p"; return 0; }
            done
            return 1
          }
          APP_PROFILE=$(pick_profile "$TEAM_ID.$APP_ID" com.apple.developer.system-extension.install) \
            || { echo "::error::no Developer ID profile for $APP_ID granting com.apple.developer.system-extension.install -- enable SYSTEM_EXTENSION_INSTALL on the App ID, recreate the profile, update APPLE_DEVID_PROVISIONING_BASE64"; exit 1; }
          SYSEX_PROFILE=$(pick_profile "$TEAM_ID.$SYSEX_ID" com.apple.developer.networking.networkextension) \
            || { echo "::error::no Developer ID profile for $SYSEX_ID in APPLE_DEVID_PROVISIONING_BASE64"; exit 1; }
          prof_ent "$SYSEX_PROFILE" com.apple.developer.networking.networkextension | grep -q 'packet-tunnel-provider-systemextension' \
            || { echo "::error::$(basename "$SYSEX_PROFILE") does not grant packet-tunnel-provider-systemextension"; exit 1; }
          echo "profiles: app=$(basename "$APP_PROFILE") sysex=$(basename "$SYSEX_PROFILE")"
          cp "$APP_PROFILE"   "$SIGN_APP/Contents/embedded.provisionprofile"
          cp "$SYSEX_PROFILE" "$SYSEX/Contents/embedded.provisionprofile"

          # ── 4. Sign inside-out: dylibs/frameworks (incl. the one inside the sysex),
          # then the sysex with its entitlements, then the app. --options runtime is
          # Hardened Runtime, which notarization requires. ──
          find "$SIGN_APP" \( -name '*.dylib' -o -name '*.framework' \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$DEVID_CERT" {}
          # [2026-09-09 v1.7.5 sysex] was:
          #   if [ -n "$APPEX" ]; then
          #     codesign --force --timestamp --options runtime \
          #       --entitlements macos/ServiceExtension/ServiceExtension.entitlements \
          #       --sign "$DEVID_CERT" "$APPEX"
          #   fi
          codesign --force --timestamp --options runtime \
            --entitlements macos/SystemTunnel/SystemTunnel.entitlements \
            --sign "$DEVID_CERT" "$SYSEX"
          # [2026-09-09 v1.7.5 sysex] was: --entitlements macos/Runner/Release.entitlements
          # (the App Store set claims appex-style "packet-tunnel-provider", which no
          # Developer ID profile grants; DeveloperID.entitlements claims the
          # -systemextension variant + system-extension.install + the identifiers
          # Xcode would otherwise inject).
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/DeveloperID.entitlements \
            --sign "$DEVID_CERT" "$SIGN_APP"

          # ── 5. Verify what was signed against what the profiles grant ──
          codesign --verify --deep --strict --verbose=2 "$SIGN_APP"
          codesign --verify --strict --verbose=2 "$SYSEX"
          ents() { codesign -d --entitlements :- "$1" 2>/dev/null > "$RUNNER_TEMP/ents.plist"; $PB -c "Print :$2" "$RUNNER_TEMP/ents.plist" 2>/dev/null; }
          [ "$(ents "$SIGN_APP" com.apple.application-identifier)" = "$TEAM_ID.$APP_ID" ] \
            || { echo "::error::app application-identifier != $TEAM_ID.$APP_ID"; exit 1; }
          [ "$(ents "$SIGN_APP" com.apple.developer.system-extension.install)" = "true" ] \
            || { echo "::error::app lacks com.apple.developer.system-extension.install"; exit 1; }
          ents "$SIGN_APP" com.apple.developer.networking.networkextension | grep -q 'packet-tunnel-provider-systemextension' \
            || { echo "::error::app NE entitlement lacks packet-tunnel-provider-systemextension"; exit 1; }
          if ents "$SIGN_APP" com.apple.developer.networking.networkextension | grep -qE '^ *packet-tunnel-provider$'; then
            echo "::error::app still claims appex-style packet-tunnel-provider, which Developer ID cannot grant"; exit 1
          fi
          ents "$SIGN_APP" com.apple.security.application-groups | grep -qx " *$APP_GROUP" || { echo "::error::app lacks app group $APP_GROUP"; exit 1; }
          [ "$(ents "$SYSEX" com.apple.application-identifier)" = "$TEAM_ID.$SYSEX_ID" ] \
            || { echo "::error::sysex application-identifier != $TEAM_ID.$SYSEX_ID"; exit 1; }
          ents "$SYSEX" com.apple.developer.networking.networkextension | grep -q 'packet-tunnel-provider-systemextension' \
            || { echo "::error::sysex lacks packet-tunnel-provider-systemextension"; exit 1; }
          if ents "$SYSEX" com.apple.security.app-sandbox >/dev/null 2>&1; then
            echo "::error::sysex is sandboxed -- it must write the user's App Group directory as root, so it must NOT carry app-sandbox"; exit 1
          fi
          codesign -dvv "$SIGN_APP" 2>&1 | grep -q 'Authority=Developer ID Application' || { echo "::error::app is not signed with Developer ID Application"; exit 1; }
          codesign -dvv "$SYSEX" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::sysex not signed with Hardened Runtime"; exit 1; }
          echo "sysex $SYSEX_ID ($SYSEX_VER/$SYSEX_BUILD) as $(basename "$SYSEX"); app $APP_ID ($APP_VER/$APP_BUILD)"

          # A drag-install DMG: the app plus a link to /Applications.
          STAGE=$RUNNER_TEMP/dmgstage
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto "$SIGN_APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"
          DMG_PATH="build/macos/${{ inputs.name }}-macos-${{ inputs.version }}.dmg"
          rm -f "$DMG_PATH"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$DEVID_CERT" "$DMG_PATH"

          # Notarize. Without this Gatekeeper still refuses the download, and the
          # ticket is stapled so the app opens even on a machine that is offline.
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          # 90m, not 30m: Apple's queue is unpredictable and the FIRST submission
          # from a new Developer ID is the slowest of all -- the 2026-09-01 run
          # was still "In Progress" when a 30m timeout cut it off, with the
          # signing and packaging already correct.
          set +e
          xcrun notarytool submit "$DMG_PATH" \
            --key ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait --timeout 90m
          NOTARY_RC=$?
          if [ $NOTARY_RC -eq 0 ]; then
            xcrun stapler staple "$DMG_PATH"
            STAPLE_RC=$?
          else
            STAPLE_RC=1
          fi
          set -e
          rm -rf ~/private_keys

          # An un-notarized DMG is worse than no DMG: Gatekeeper refuses it, and
          # a user who downloads one concludes the app is broken. So publish it
          # only when the ticket is actually stapled -- but do NOT fail the job,
          # because the .zip/.pkg this run also produced are unaffected and a
          # slow Apple queue is not a build error.
          if [ $NOTARY_RC -eq 0 ] && [ $STAPLE_RC -eq 0 ]; then
            # Proof, not assumption: the same evaluation a user's Mac performs.
            spctl -a -vvv -t install "$DMG_PATH" || true
            # [2026-09-09 v1.7.5] and the app as Gatekeeper assesses it after the
            # drag-install (ticket looked up online; the staple lives on the DMG).
            spctl -a -t exec -vv "$SIGN_APP" || echo "::warning::spctl did not accept $APP_NAME.app as a notarized Developer ID app (online ticket lookup may lag); the stapled DMG above was accepted"
            echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
            echo "DMG ready: notarized and stapled, tunnel = system extension $SYSEX_ID."
          else
            echo "::warning::Notarization did not complete (notarytool rc=$NOTARY_RC, stapler rc=$STAPLE_RC). The DMG was built and signed but is NOT published, because an un-stapled DMG is rejected by Gatekeeper. Re-run this workflow; Apple's queue is usually faster on later submissions."
          fi

      - name: Upload DMG to GitHub release
        if: matrix.platform == 'macos' && env.DMG_PATH != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: ${{ env.DMG_PATH }}


      # [2026-09-07] Mirror the artifact into the fjolsky-downloads R2 bucket so
      # dl.<brand>/macos serves it from our own account (the Worker falls back
      # to this GitHub release only while R2 has no manifest). Additive:
      # continue-on-error, never blocks the release. Secrets: CLOUDFLARE_ACCOUNT_ID,
      # CLOUDFLARE_R2_TOKEN (R2-only token), R2_BUCKET. The app slug is the part of
      # PRIVATE_REPO after the slash (NOT inputs.name, which is vpn00000 for
      # 00000vpn). Keeps the two newest tags per app plus anything a latest/*.json
      # still points at, so the bucket stays inside the R2 free tier. A re-run of an
      # OLD release uploads its object but never repoints dl.* backwards.
      # Source of truth: XTPU/cloudflare/ci-r2-upload-step.yml.
      - name: Publish to R2 (dl.<brand> direct downloads)
        if: matrix.platform == 'macos' && env.DMG_PATH != ''
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ inputs.version }}
          PLATFORM: macos
          FILE: ${{ env.DMG_PATH }}
          KEEP_TAGS: "2"
        run: |
          set -euo pipefail
          APP="${PRIVATE_REPO:-}"; APP=$(printf %s "${APP#*/}" | tr 'A-Z' 'a-z')
          if [ -z "${CF_R2_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "$APP" ] || [ -z "${FILE:-}" ]; then echo "R2 not configured or no file; skipping."; exit 0; fi
          FILE="${FILE//\\//}"
          [ -f "$FILE" ] || { echo "artifact not found: $FILE"; exit 0; }
          PY=$(command -v python3 || command -v python)
          case "$PLATFORM" in
            android) CT=application/vnd.android.package-archive;;
            windows) CT=application/zip;;
            macos)   CT=application/x-apple-diskimage;;
            *) echo "unknown PLATFORM=$PLATFORM"; exit 0;;
          esac
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$R2_BUCKET"
          AUTH="Authorization: Bearer $CF_R2_TOKEN"
          enc() { "$PY" -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$1" | tr -d '\r'; }
          NAME=$(basename "$FILE"); KEY="$APP/$TAG/$NAME"
          SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
          SHA=$( (sha256sum "$FILE" 2>/dev/null || shasum -a 256 "$FILE") | cut -d' ' -f1)
          # 1) the bytes
          curl -fsS -m 1200 -X PUT "$API/objects/$(enc "$KEY")" -H "$AUTH" -H "Content-Type: $CT" --upload-file "$FILE" >/dev/null
          echo "R2: uploaded $KEY ($((SIZE/1048576)) MB)"
          # 2) the manifest -- unless the one already there points at a NEWER tag
          curl -fsS -m 120 "$API/objects/$(enc "$APP/latest/$PLATFORM.json")" -H "$AUTH" -o r2-current.json 2>/dev/null || echo '{}' > r2-current.json
          if "$PY" - "$TAG" <<'PYEOF'
          import json,re,sys
          def v(t):
              m=re.match(r"v?(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?$",t or ""); return tuple(int(x or 0) for x in m.groups()) if m else None
          try: cur=json.load(open("r2-current.json")).get("tag")
          except Exception: cur=None
          new=sys.argv[1]
          sys.exit(1 if (v(cur) and v(new) and v(cur)>v(new)) else 0)
          PYEOF
          then
            printf '{"tag":"%s","key":"%s","size":%s,"sha256":"%s","content_type":"%s","published_at":"%s","source":"github-actions %s"}\n' \
              "$TAG" "$KEY" "$SIZE" "$SHA" "$CT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > r2-manifest.json
            curl -fsS -m 120 -X PUT "$API/objects/$(enc "$APP/latest/$PLATFORM.json")" -H "$AUTH" -H "Content-Type: application/json" --upload-file r2-manifest.json >/dev/null
            echo "R2: $APP/latest/$PLATFORM.json -> $TAG"
          else
            echo "R2: NOT repointing $APP/latest/$PLATFORM.json (it points at a newer tag than $TAG); object uploaded only"
          fi
          # 3) prune: keep the KEEP_TAGS newest tags (by last_modified) plus every tag a latest/*.json references
          curl -fsS -m 120 "$API/objects?prefix=$(enc "$APP/")&per_page=1000" -H "$AUTH" > r2-listing.json
          for p in android windows macos; do curl -fsS -m 120 "$API/objects/$(enc "$APP/latest/$p.json")" -H "$AUTH" -o "r2-ref-$p.json" 2>/dev/null || echo '{}' > "r2-ref-$p.json"; done
          "$PY" - "$APP" "$TAG" "$KEEP_TAGS" > r2-prune.txt <<'PYEOF'
          import json,sys,collections
          app,newtag,keep=sys.argv[1],sys.argv[2],int(sys.argv[3])
          objs=json.load(open("r2-listing.json")).get("result",[])
          protected={newtag}
          for p in ("android","windows","macos"):
              try: t=json.load(open("r2-ref-%s.json"%p)).get("tag")
              except Exception: t=None
              if t: protected.add(t)
          bytag=collections.defaultdict(list); newest={}
          for o in objs:
              parts=o["key"].split("/")
              if len(parts)<3 or parts[1]=="latest": continue
              ts=o.get("last_modified") or o.get("uploaded") or ""
              bytag[parts[1]].append(o["key"]); newest[parts[1]]=max(newest.get(parts[1],""),ts)
          order=sorted(bytag,key=lambda t:(t in protected,newest[t]),reverse=True)
          for t in order[keep:]:
              if t in protected: continue
              for k in bytag[t]: print(k)
          PYEOF
          while read -r k; do k="${k%$'\r'}"; [ -z "$k" ] && continue; curl -fsS -m 120 -X DELETE "$API/objects/$(enc "$k")" -H "$AUTH" >/dev/null && echo "pruned $k" || echo "prune skipped $k"; done < r2-prune.txt

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Setup App Store Connect API Key
        if: inputs.publish_to_stores || (inputs.publish_ios_testflight && matrix.platform == 'ios') || (inputs.publish_macos_testflight && matrix.platform == 'macos')
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload to App Store Connect
        if: inputs.publish_to_stores || (inputs.publish_ios_testflight && matrix.platform == 'ios') || (inputs.publish_macos_testflight && matrix.platform == 'macos')
        id: publish
        continue-on-error: true
        run: |
          PLATFORM_TYPE=${{ matrix.platform == 'ios' && 'ios' || 'osx' }}
          xcrun altool --upload-app \
            --type $PLATFORM_TYPE \
            --file "$UPLOAD_FILE" \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER_ID }}"

      - name: Upload to GitHub release
        if: ${{ !inputs.publish_to_stores || steps.publish.outcome == 'failure' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: ${{ env.UPLOAD_FILE }}

      - name: Clean up API key
        if: always() && (inputs.publish_to_stores || (inputs.publish_ios_testflight && matrix.platform == 'ios') || (inputs.publish_macos_testflight && matrix.platform == 'macos'))
        run: rm -rf ~/private_keys

      # [2026-09-09 v1.7.5] Loud failure, placed AFTER the store uploads: the DMG
      # step runs with continue-on-error so a system-extension / signing problem
      # can never skip the .pkg/.ipa upload, but the run must still go red and
      # nothing reaches R2/GitHub for macOS direct download (DMG_PATH stays empty).
      - name: Fail the job if the DMG step failed
        if: always() && matrix.platform == 'macos' && steps.dmg.outcome == 'failure'
        run: |
          echo "::error::'Build notarized DMG' failed (system-extension build/assembly, profiles, signing or verification). No macOS DMG was published."
          exit 1
